name: Auto-Sync Google Sheet Logos

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour at minute 0
  workflow_dispatch: # Allows you to manually trigger it by clicking a button on GitHub!

jobs:
  sync_logos:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Needed to push new images back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: |
          pip install pandas requests

      - name: Run Downloader Script
        run: python sync_logos.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add campaign_logos/
          git commit -m "Auto-downloaded new logos from Google Sheet" || echo "No new logos to commit"
          git push
